
name: Build Bloody Hand Windows Installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '!README.md'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Installers
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run dist

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: Bloody-Hand-Windows-Installers
          path: |
            dist/*.exe
            release/*.exe
          if-no-files-found: error
          retention-days: 14
