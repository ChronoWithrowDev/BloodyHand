
name: Build Bloody Hand Horror Game

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare desktop app and build
        shell: pwsh
        run: |
          Set-Location "bloody-hand-horror-game"

          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          npm install --save-dev electron@44.7.0 electron-builder@26.15.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force electron | Out-Null

          @'
          const { app, BrowserWindow, shell } = require("electron");
          const path = require("node:path");

          function createWindow() {
            const win = new BrowserWindow({
              width: 1360,
              height: 850,
              minWidth: 980,
              minHeight: 620,
              backgroundColor: "#08070a",
              title: "Bloody Hand - Horror Game",
              autoHideMenuBar: true,
              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true
              }
            });

            win.webContents.setWindowOpenHandler(({ url }) => {
              if (url.startsWith("https://") || url.startsWith("http://")) {
                shell.openExternal(url).catch(() => {});
              }
              return { action: "deny" };
            });

            win.loadFile(path.join(__dirname, "..", "dist", "index.html"));
          }

          app.whenReady().then(() => {
            createWindow();
            app.on("activate", () => {
              if (BrowserWindow.getAllWindows().length === 0) createWindow();
            });
          });

          app.on("window-all-closed", () => {
            if (process.platform !== "darwin") app.quit();
          });
          '@ | Set-Content -Path "electron/main.cjs" -Encoding utf8

          @'
          appId: com.bloodyhand.horrorgame
          productName: Bloody Hand Horror Game
          directories:
            output: release
          files:
            - dist/**/*
            - electron/main.cjs
            - package.json
          asar: true
          extraMetadata:
            main: electron/main.cjs
          win:
            target:
              - target: nsis
                arch: [x64]
              - target: portable
                arch: [x64]
            artifactName: 'Bloody-Hand-${version}-${target}.${ext}'
          nsis:
            oneClick: false
            allowToChangeInstallationDirectory: true
            createDesktopShortcut: true
            createStartMenuShortcut: true
            shortcutName: Bloody Hand Horror Game
          '@ | Set-Content -Path "electron-builder.yml" -Encoding utf8

          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          npx electron-builder --win nsis portable --config electron-builder.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: Bloody-Hand-Windows-Installers
          path: bloody-hand-horror-game/release/*.exe
          if-no-files-found: error
          retention-days: 30
